name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Instancia a la que desplegar'
        type: choice
        options: [bar777, nextup-demo]
        required: true
jobs:
  deploy-bar777:
    if: ${{ inputs.environment == 'bar777' }}
    permissions:
      contents: write
    uses: nextup-py/deploy-actions/.github/workflows/laravel-deploy.yml@9fc64c40637a060f8c1ac7c792c44d0717244b03 # v1.2.0
    with:
      environment_name: bar777
      run_tests: true
      run_migrations: true
    secrets:
      SSH_HOST: ${{ secrets.BAR777_SSH_HOST }}
      SSH_PORT: ${{ secrets.BAR777_SSH_PORT }}
      SSH_USER: ${{ secrets.BAR777_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.BAR777_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.BAR777_DEPLOY_PATH }}
      APP_URL: ${{ secrets.BAR777_APP_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
  deploy-nextup-demo:
    if: ${{ inputs.environment == 'nextup-demo' }}
    permissions:
      contents: write
    uses: nextup-py/deploy-actions/.github/workflows/laravel-deploy.yml@9fc64c40637a060f8c1ac7c792c44d0717244b03 # v1.2.0
    with:
      environment_name: nextup-demo
      run_tests: true
      run_migrations: true
    secrets:
      SSH_HOST: ${{ secrets.NEXTUP_DEMO_SSH_HOST }}
      SSH_PORT: ${{ secrets.NEXTUP_DEMO_SSH_PORT }}
      SSH_USER: ${{ secrets.NEXTUP_DEMO_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.NEXTUP_DEMO_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.NEXTUP_DEMO_DEPLOY_PATH }}
      APP_URL: ${{ secrets.NEXTUP_DEMO_APP_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
